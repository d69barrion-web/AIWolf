<!DOCTYPE html>
<html lang="tl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Palakihin ang Lobo, Huwag ang Tupa</title>

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f1e8;
    color: #292929;
    line-height: 1.75;
}


/* =========================================
   TOP BAR
========================================= */

.topbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: #242424;
    color: white;

    padding: 10px 15px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.book-title {
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
}

.top-buttons {
    display: flex;
    gap: 6px;
}

.top-buttons button {
    border: none;
    border-radius: 6px;

    padding: 7px 10px;

    background: #444;
    color: white;

    cursor: pointer;
}

.top-buttons button:hover {
    background: #555;
}


/* =========================================
   READER
========================================= */

.reader {
    max-width: 850px;
    margin: 0 auto;

    padding: 30px 20px 80px;
}

.chapter-info {
    font-family: Arial, sans-serif;
    text-align: center;

    margin-bottom: 25px;

    color: #777;
    font-size: 13px;
}

#chapterContent {
    background: #fffdf8;

    padding: 35px 30px;

    border-radius: 10px;

    box-shadow:
        0 2px 12px rgba(0,0,0,0.08);
}


/* =========================================
   MARKDOWN TYPOGRAPHY
========================================= */

#chapterContent h1 {
    font-family: Arial, sans-serif;

    font-size: 30px;
    line-height: 1.25;

    margin-top: 0;
    margin-bottom: 20px;
}

#chapterContent h2 {
    font-family: Arial, sans-serif;

    font-size: 25px;

    margin-top: 45px;
}

#chapterContent h3 {
    font-family: Arial, sans-serif;

    font-size: 20px;

    margin-top: 35px;
}

#chapterContent p {
    margin: 18px 0;
}

#chapterContent blockquote {
    margin: 25px 0;

    padding: 12px 20px;

    border-left: 5px solid #555;

    background: #f1eee5;

    font-style: italic;
}

#chapterContent strong {
    font-weight: bold;
}

#chapterContent ul,
#chapterContent ol {
    padding-left: 28px;
}

#chapterContent hr {
    border: none;
    border-top: 1px solid #ddd;

    margin: 40px 0;
}


/* =========================================
   NAVIGATION
========================================= */

.chapter-navigation {
    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-top: 25px;
}

.chapter-navigation button {
    flex: 1;

    padding: 12px;

    border: none;
    border-radius: 8px;

    background: #333;
    color: white;

    font-size: 14px;

    cursor: pointer;
}

.chapter-navigation button:hover {
    background: #555;
}

.chapter-navigation button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}


/* =========================================
   AIWOLF
========================================= */

.aiwolf {
    margin-top: 45px;

    background: #1f1f1f;
    color: #f5f5f5;

    border-radius: 12px;

    padding: 20px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.25);
}

.aiwolf-header {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;
}

.aiwolf-icon {
    font-size: 35px;
}

.aiwolf-title {
    font-family: Arial, sans-serif;

    font-size: 22px;
    font-weight: bold;
}

.aiwolf-intro {
    color: #ccc;

    font-size: 14px;

    margin-bottom: 15px;
}


/* =========================================
   MODE BUTTONS
========================================= */

.mode-buttons {
    display: flex;

    gap: 8px;

    margin-bottom: 15px;
}

.mode-buttons button {
    flex: 1;

    padding: 9px;

    border: none;

    border-radius: 7px;

    background: #444;
    color: white;

    cursor: pointer;
}

.mode-buttons button.active {
    background: #777;
}


/* =========================================
   SUGGESTED QUESTIONS
========================================= */

.suggestions {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 15px;
}

.suggestions button {
    border: 1px solid #555;

    background: #2d2d2d;

    color: #ddd;

    border-radius: 20px;

    padding: 7px 11px;

    font-size: 12px;

    cursor: pointer;
}

.suggestions button:hover {
    background: #444;
}


/* =========================================
   CHAT
========================================= */

.chat {
    max-height: 420px;

    overflow-y: auto;

    padding: 5px 0;
}

.message {
    margin: 12px 0;

    padding: 12px 14px;

    border-radius: 9px;

    font-family: Arial, sans-serif;

    font-size: 14px;

    white-space: pre-wrap;
}

.user-message {
    background: #3b3b3b;

    margin-left: 15%;
}

.ai-message {
    background: #292929;

    margin-right: 8%;

    border-left: 3px solid #777;
}


/* =========================================
   INPUT
========================================= */

.aiwolf-input {
    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.aiwolf-input textarea {
    flex: 1;

    resize: none;

    min-height: 48px;

    max-height: 130px;

    padding: 12px;

    border-radius: 8px;

    border: 1px solid #555;

    background: #2b2b2b;

    color: white;

    font-family: Arial, sans-serif;

    outline: none;
}

.aiwolf-input textarea:focus {
    border-color: #888;
}

.aiwolf-input button {
    width: 75px;

    border: none;

    border-radius: 8px;

    background: #777;

    color: white;

    cursor: pointer;
}

.aiwolf-input button:hover {
    background: #888;
}

.aiwolf-input button:disabled {
    opacity: 0.4;

    cursor: not-allowed;
}


/* =========================================
   STATUS
========================================= */

.aiwolf-status {
    font-family: Arial, sans-serif;

    font-size: 12px;

    color: #999;

    margin-top: 8px;

    min-height: 18px;
}


/* =========================================
   LOADING
========================================= */

.loading {
    text-align: center;

    padding: 50px 10px;

    color: #777;

    font-family: Arial, sans-serif;
}


/* =========================================
   ERROR
========================================= */

.error-box {
    background: #fff0f0;

    color: #8a0000;

    border: 1px solid #e0aaaa;

    padding: 20px;

    border-radius: 8px;

    font-family: Arial, sans-serif;
}


/* =========================================
   FOOTER
========================================= */

footer {
    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 12px;

    color: #888;

    margin-top: 30px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .reader {
        padding: 20px 10px 60px;
    }

    #chapterContent {
        padding: 25px 20px;
    }

    #chapterContent h1 {
        font-size: 27px;
    }

    #chapterContent h2 {
        font-size: 22px;
    }

    .user-message {
        margin-left: 5%;
    }

    .ai-message {
        margin-right: 3%;
    }

    .chapter-navigation button {
        font-size: 12px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     TOP BAR
========================================= -->

<div class="topbar">

    <div class="book-title">
        🐺 Palakihin ang Lobo, Huwag ang Tupa
    </div>

    <div class="top-buttons">

        <button onclick="goToContents()">
            Contents
        </button>

    </div>

</div>


<!-- =========================================
     READER
========================================= -->

<main class="reader">

    <div id="chapterInfo" class="chapter-info">
        Naglo-load ng chapter...
    </div>


    <article id="chapterContent">

        <div class="loading">
            Binabasa ang chapter...
        </div>

    </article>


    <!-- =====================================
         CHAPTER NAVIGATION
    ====================================== -->

    <div class="chapter-navigation">

        <button
            id="previousButton"
            onclick="previousChapter()">
            ← Previous
        </button>

        <button
            id="nextButton"
            onclick="nextChapter()">
            Next →
        </button>

    </div>


    <!-- =====================================
         AIWOLF
    ====================================== -->

    <section class="aiwolf">

        <div class="aiwolf-header">

            <div class="aiwolf-icon">
                🐺
            </div>

            <div class="aiwolf-title">
                AIWolf
            </div>

        </div>


        <div class="aiwolf-intro">

            Kasama mo si AIWolf sa pagbabasa.
            Maaari mo siyang tanungin tungkol sa
            kabanata, humingi ng paliwanag, o gamitin
            siya para mas malalim pang pag-isipan ang
            mga ideya.

        </div>


        <!-- MODE -->

        <div class="mode-buttons">

            <button
                id="childModeButton"
                class="active"
                onclick="setMode('child')">

                🧒 Child Mode

            </button>


            <button
                id="parentModeButton"
                onclick="setMode('parent')">

                👨‍👩‍👧 Parent Mode

            </button>

        </div>


        <!-- SUGGESTIONS -->

        <div class="suggestions">

            <button onclick="askSuggested(
                'Ano ang pangunahing ideya ng chapter na ito?'
            )">
                Main idea
            </button>


            <button onclick="askSuggested(
                'Ipaliwanag mo ito nang simple.'
            )">
                Explain simply
            </button>


            <button onclick="askSuggested(
                'Bigyan mo ako ng halimbawa sa totoong buhay.'
            )">
                Give example
            </button>


            <button onclick="askSuggested(
                'Bigyan mo ako ng tanong na makapagpapaisip sa akin.'
            )">
                Make me think
            </button>


            <button onclick="askSuggested(
                'Ano ang ibig sabihin ng lobo sa chapter na ito?'
            )">
                What does wolf mean?
            </button>

        </div>


        <!-- CHAT -->

        <div
            id="chat"
            class="chat">
        </div>


        <!-- INPUT -->

        <div class="aiwolf-input">

            <textarea
                id="questionInput"
                placeholder="Tanungin si AIWolf..."
                onkeydown="handleInputKey(event)">
            </textarea>


            <button
                id="sendButton"
                onclick="sendQuestion()">

                Send

            </button>

        </div>


        <div
            id="aiwolfStatus"
            class="aiwolf-status">
        </div>

    </section>


    <footer>

        🐺 AIWolf — Reading Companion

    </footer>

</main>


<script>

/*
==================================================
CHAPTER CONFIGURATION
==================================================
*/

/*
Maximum number of chapters.

Palitan lamang ito kapag nadagdagan ang
mga chapter ng libro.
*/

const TOTAL_CHAPTERS = 16;


/*
Current chapter
*/

let currentChapter = 1;


/*
Current chapter markdown text
*/

let currentChapterText = "";


/*
AIWolf mode
*/

let currentMode = "child";


/*
==================================================
GET CHAPTER NUMBER FROM URL
==================================================
*/

function getChapterNumber() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const value =
        parseInt(
            params.get("chapter"),
            10
        );


    /*
    Kung walang chapter parameter,
    default sa Chapter 1.
    */

    if (
        isNaN(value) ||
        value < 1 ||
        value > TOTAL_CHAPTERS
    ) {

        return 1;

    }


    return value;

}


/*
==================================================
LOAD CHAPTER
==================================================
*/

async function loadChapter() {

    currentChapter =
        getChapterNumber();


    const mdFile =
        `Chapter${currentChapter}-fil.md`;


    const content =
        document.getElementById(
            "chapterContent"
        );


    const info =
        document.getElementById(
            "chapterInfo"
        );


    content.innerHTML = `
        <div class="loading">
            Binabasa ang Chapter ${currentChapter}...
        </div>
    `;


    info.textContent =
        `Chapter ${currentChapter} of ${TOTAL_CHAPTERS}`;


    try {

        const response =
            await fetch(mdFile);


        if (!response.ok) {

            throw new Error(
                `Hindi mahanap ang ${mdFile}`
            );

        }


        currentChapterText =
            await response.text();


        /*
        Render Markdown
        */

        content.innerHTML =
            marked.parse(
                currentChapterText
            );


        /*
        Update navigation
        */

        updateNavigation();


        /*
        Update browser title
        */

        updatePageTitle();


        /*
        Clear previous AIWolf conversation
        */

        clearChat();


        /*
        Scroll to top
        */

        window.scrollTo({
            top: 0,
            behavior: "instant"
        });


    } catch (error) {

        console.error(error);


        content.innerHTML = `
            <div class="error-box">

                <strong>
                    Hindi ma-load ang chapter.
                </strong>

                <p>
                    Sinubukang basahin:
                    <br>
                    <code>${mdFile}</code>
                </p>

                <p>
                    Siguraduhing nasa tamang folder
                    ang Markdown file.
                </p>

            </div>
        `;

        info.textContent =
            `Chapter ${currentChapter}`;

    }

}


/*
==================================================
PAGE TITLE
==================================================
*/

function updatePageTitle() {

    document.title =
        `Chapter ${currentChapter} — Palakihin ang Lobo`;

}


/*
==================================================
NAVIGATION
==================================================
*/

function updateNavigation() {

    const previous =
        document.getElementById(
            "previousButton"
        );

    const next =
        document.getElementById(
            "nextButton"
        );


    previous.disabled =
        currentChapter <= 1;


    next.disabled =
        currentChapter >= TOTAL_CHAPTERS;

}


/*
==================================================
OPEN CHAPTER
==================================================
*/

function openChapter(number) {

    if (
        number < 1 ||
        number > TOTAL_CHAPTERS
    ) {

        return;

    }


    window.location.href =
        `Chapters.html?chapter=${number}`;

}


/*
==================================================
PREVIOUS
==================================================
*/

function previousChapter() {

    if (currentChapter > 1) {

        openChapter(
            currentChapter - 1
        );

    }

}


/*
==================================================
NEXT
==================================================
*/

function nextChapter() {

    if (
        currentChapter < TOTAL_CHAPTERS
    ) {

        openChapter(
            currentChapter + 1
        );

    }

}


/*
==================================================
CONTENTS
==================================================
*/

function goToContents() {

    window.location.href =
        "index.html";

}


/*
==================================================
AIWOLF MODE
==================================================
*/

function setMode(mode) {

    currentMode =
        mode;


    const childButton =
        document.getElementById(
            "childModeButton"
        );


    const parentButton =
        document.getElementById(
            "parentModeButton"
        );


    childButton.classList.toggle(
        "active",
        mode === "child"
    );


    parentButton.classList.toggle(
        "active",
        mode === "parent"
    );


    setStatus(
        mode === "child"
            ? "Child Mode"
            : "Parent Mode"
    );

}


/*
==================================================
AIWOLF CHAT
==================================================
*/

function addMessage(
    text,
    type
) {

    const chat =
        document.getElementById(
            "chat"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        `message ${type}`;


    message.textContent =
        text;


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/*
==================================================
CLEAR CHAT
==================================================
*/

function clearChat() {

    const chat =
        document.getElementById(
            "chat"
        );


    chat.innerHTML = "";


    setStatus(
        `AIWolf is ready — Chapter ${currentChapter}`
    );

}


/*
==================================================
STATUS
==================================================
*/

function setStatus(text) {

    document.getElementById(
        "aiwolfStatus"
    ).textContent =
        text;

}


/*
==================================================
SUGGESTED QUESTION
==================================================
*/

function askSuggested(question) {

    document.getElementById(
        "questionInput"
    ).value =
        question;


    sendQuestion();

}


/*
==================================================
SEND QUESTION TO AIWOLF
==================================================
*/

async function sendQuestion() {

    const input =
        document.getElementById(
            "questionInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const question =
        input.value.trim();


    if (!question) {

        return;

    }


    /*
    Make sure chapter has loaded
    */

    if (!currentChapterText) {

        setStatus(
            "Hindi pa handa ang chapter."
        );

        return;

    }


    /*
    Display user's question
    */

    addMessage(
        question,
        "user-message"
    );


    /*
    Clear input
    */

    input.value = "";


    /*
    Disable button
    */

    sendButton.disabled =
        true;


    setStatus(
        "🐺 AIWolf is thinking..."
    );


    try {

        /*
        ------------------------------------------
        EXISTING RENDER SERVER
        ------------------------------------------
        */

        const response =
            await fetch(
                "https://mychatbot-ct9m.onrender.com/api/aiwolf",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        question:
                            question,

                        chapter:
                            currentChapter,

                        mode:
                            currentMode,

                        chapterText:
                            currentChapterText

                    })

                }
            );


        const data =
            await response.json();


        /*
        ------------------------------------------
        SERVER ERROR
        ------------------------------------------
        */

        if (!response.ok) {

            throw new Error(
                data.error ||
                "AIWolf server error."
            );

        }


        /*
        ------------------------------------------
        AIWOLF RESPONSE
        ------------------------------------------
        */

        addMessage(
            data.reply ||
            "Walang natanggap na sagot mula kay AIWolf.",
            "ai-message"
        );


        setStatus(
            `🐺 AIWolf — ${currentMode} mode`
        );


    } catch (error) {

        console.error(
            "AIWolf request error:",
            error
        );


        addMessage(
            "Pasensya na. Nagkaroon ng problema habang sinasagot ang tanong.",
            "ai-message"
        );


        setStatus(
            `Error: ${error.message}`
        );

    } finally {

        sendButton.disabled =
            false;

        input.focus();

    }

}


/*
==================================================
ENTER KEY
==================================================
*/

function handleInputKey(event) {

    /*
    Enter = send
    Shift + Enter = bagong linya
    */

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendQuestion();

    }

}


/*
==================================================
START
==================================================
*/

loadChapter();

</script>


</body>
</html>
